  <title>Meal Prep</title>

    * {

      padding: 0;

      color: #f0ede8;

      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 40px;
    }

    header {
      width: 100%;
      padding: 56px 24px 24px;
      text-align: center;
    }

    header h1 {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
    }

    .week-label {
      font-size: 12px;
      color: #555;
      margin-top: 6px;
      letter-spacing: 0.05em;
    }

    .main {
      width: 100%;
      max-width: 420px;
      padding: 0 20px;
      flex: 1;
    }

    .cuisine-card {
      background: #1c1c1c;
      border-radius: 20px;
      padding: 32px 24px 28px;
      text-align: center;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      transition: opacity 0.2s;
    }

    .cuisine-card.spinning {
      opacity: 0.4;
    }

    .cuisine-emoji {
      font-size: 52px;
      line-height: 1;
      margin-bottom: 12px;
      display: block;
    }

    .cuisine-name {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #f0ede8;
    }

    .cuisine-tagline {
      font-size: 13px;
      color: #666;
      margin-top: 6px;
    }

    .spin-btn {
      margin-top: 20px;
      background: #f0ede8;
      color: #111;
      border: none;
      border-radius: 100px;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .spin-btn:active {
      opacity: 0.8;
      transform: scale(0.97);
    }

    .meals-section {
      margin-top: 8px;
    }

    .meals-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      margin-bottom: 10px;
    }

    .meals-header span {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #555;
    }

    .reroll-btn {
      background: none;
      border: 1px solid #2e2e2e;
      border-radius: 100px;
      color: #777;
      font-size: 12px;
      padding: 5px 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .reroll-btn:active {
      color: #f0ede8;
      border-color: #555;
    }

    .meal-card {
      background: #1c1c1c;
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
    }

    .meal-card.done {
      opacity: 0.45;
    }

    .meal-card.done .meal-name {
      text-decoration: line-through;
      text-decoration-color: #555;
    }

    .meal-number {
      font-size: 11px;
      font-weight: 600;
      color: #444;
      letter-spacing: 0.05em;
      padding-top: 3px;
      min-width: 18px;
    }

    .meal-info {
      flex: 1;
    }

    .meal-name {
      font-size: 16px;
      font-weight: 500;
      color: #f0ede8;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .meal-prep {
      font-size: 12px;
      color: #555;
      line-height: 1.5;
    }

    .check-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid #2e2e2e;
      flex-shrink: 0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .meal-card.done .check-icon {
      background: #333;
      border-color: #333;
    }

    .check-icon svg {
      opacity: 0;
      transition: opacity 0.15s;
    }

    .meal-card.done .check-icon svg {
      opacity: 1;
    }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: #444;
      font-size: 14px;
      line-height: 1.8;
    }

    .empty-state .big-text {
      font-size: 40px;
      margin-bottom: 16px;
    }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #333;
      margin-top: 32px;
      padding: 0 24px;
      line-height: 1.7;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-in {
      animation: fadeIn 0.25s ease forwards;
    }
  </style>
</head>

  let currentCuisine = null;
  let currentMeals = [];
  let doneState = {};

  function getWeekLabel() {
    const now = new Date();
    const day = now.getDay();
    const diff = now.getDate() - day + (day === 0 ? -6 : 1);
    const monday = new Date(now.setDate(diff));
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    const opts = { month: 'short', day: 'numeric' };
    return `Week of ${monday.toLocaleDateString('en-US', opts)} — ${sunday.toLocaleDateString('en-US', opts)}`;
  }

  function pickRandom(arr, n) {
    const shuffled = [...arr].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, n);
  }

  function decideCuisine() {
    const card = document.getElementById('cuisine-card');
    card.classList.add('spinning');

    setTimeout(() => {
      const prev = currentCuisine;
      let pick;
      do {
        pick = cuisines[Math.floor(Math.random() * cuisines.length)];
      } while (pick === prev && cuisines.length > 1);

      currentCuisine = pick;
      doneState = {};
      setMeals(pickRandom(pick.meals, 3));

      document.getElementById('cuisine-emoji').textContent = pick.emoji;
      document.getElementById('cuisine-name').textContent = pick.name;
      document.getElementById('cuisine-tagline').textContent = pick.tagline;
      document.getElementById('spin-btn').textContent = 'Pick Different';

      card.classList.remove('spinning');
      card.classList.add('animate-in');
      setTimeout(() => card.classList.remove('animate-in'), 300);

      renderMeals();

      const section = document.getElementById('meals-section');
      section.style.display = 'block';
      section.classList.add('animate-in');
      setTimeout(() => section.classList.remove('animate-in'), 300);

      document.getElementById('footer-note').textContent = 'Tap a meal to mark it done.';
    }, 200);
  }

  function setMeals(meals) {
    currentMeals = meals;
    doneState = {};
  }

  function rerollMeals() {
    if (!currentCuisine) return;
    setMeals(pickRandom(currentCuisine.meals, 3));
    renderMeals();
  }

  function toggleDone(index) {
    doneState[index] = !doneState[index];
    renderMeals();
  }

  function renderMeals() {
    const list = document.getElementById('meals-list');
    list.innerHTML = '';
    currentMeals.forEach((meal, i) => {
      const done = !!doneState[i];
      const card = document.createElement('div');
      card.className = `meal-card${done ? ' done' : ''}`;
      card.onclick = () => toggleDone(i);
      card.innerHTML = `
        <div class="meal-number">0${i + 1}</div>
        <div class="meal-info">
          <div class="meal-name">${meal.name}</div>
          <div class="meal-prep">${meal.prep}</div>
        </div>
        <div class="check-icon">
          <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
            <path d="M1 4L3.5 6.5L9 1" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      `;
      list.appendChild(card);
    });
  }

  document.getElementById('week-label').textContent = getWeekLabel();
</script>
